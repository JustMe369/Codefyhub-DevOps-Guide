# CodefyHub mdadm monitoring recipe
# Target: Ubuntu Server 24.04 LTS / mdadm 4.x
# Replace example.invalid before installation and verify end-to-end delivery.

DEVICE partitions containers
HOMEHOST <system>
MAILADDR storage-alerts@example.invalid

# Generate the authoritative ARRAY line on the target host with:
#   sudo mdadm --detail --scan
# Paste that exact reviewed line below. Do not copy an array UUID from another host.
ARRAY /dev/md0 metadata=1.2 UUID=<array-uuid> name=<host>:0
