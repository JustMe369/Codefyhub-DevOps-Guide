name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_USER: devops_guide
          POSTGRES_PASSWORD: test_password_only
          POSTGRES_DB: devops_guide
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devops_guide -d devops_guide"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://devops_guide:test_password_only@127.0.0.1:5432/devops_guide?schema=public
      BETTER_AUTH_SECRET: test-only-e2e-better-auth-secret-not-for-reuse-2026-ci-isolated
      BETTER_AUTH_URL: http://127.0.0.1:3100
      CONTENT_VERIFIED_AT: 2026-10-26
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      ADMIN_BOOTSTRAP_EMAIL: e2e-admin@codefyhub.local
      ADMIN_BOOTSTRAP_PASSWORD: test-only-e2e-admin-password-not-for-reuse
      MEMBER_TEST_EMAIL: e2e-member@codefyhub.local
      MEMBER_TEST_PASSWORD: test-only-e2e-member-password-not-for-reuse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run secrets:check
      - run: npm run content:source
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run admin:bootstrap
      - run: npm run e2e:bootstrap-member
      - run: npm run tenant:check
      - run: npm run content:check
      - run: npm run content:internal-links
      - run: npm run search:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: true
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build, migrate, and deploy with the Vercel production environment
        run: npx --yes vercel@65.4.0 deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Publish source-controlled content
        run: npm run deploy:content
      - name: Post-deployment smoke checks
        run: |
          curl -fsS "${NEXT_PUBLIC_SITE_URL}/api/health" || exit 1
          curl -fsS "${NEXT_PUBLIC_SITE_URL}/search?q=test" || exit 1
